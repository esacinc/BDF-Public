<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>{{ subject or "BioInsight AI" }}</title>
  </head>
  <body style="font-family: Arial, sans-serif; background-color:#f9f9f9; padding:20px;">
    <table width="100%" style="max-width:600px; margin:auto; background:#ffffff; border-radius:8px; padding:20px; border:1px solid #eaeaea;">
      <tr>
        <td style="text-align:center;">
          <img src="{{ logo_url }}" alt="BioInsight AI" style="height:60px; margin-bottom:20px;" width="120" />
        </td>
      </tr>
      <tr>
        <td>
          {% block content %}{% endblock %}
          <br />
          <p style="font-size:14px; color:#888;">
            Thank you,<br/>BioInsight AI Team
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
