worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;

    # WebSocket upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        server_name _;

        port_in_redirect on;

        # ============================================================
        # 💓 HEALTH CHECK (FastAPI)
        # ============================================================
        location = /health {
            proxy_pass http://127.0.0.1:7000/health;
            proxy_set_header Host 127.0.0.1;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ============================================================
        # Redirect bare root → /login
        # ============================================================
        location = / {
            return 302 /login;
        }

        # ============================================================
        # NEXT.JS FRONTEND (port 3000)
        # ============================================================
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # ============================================================
        # FASTAPI AUTH BACKEND
        # ============================================================
        location /api/auth/ {
            proxy_pass http://127.0.0.1:7000/auth/;

            proxy_set_header Host 127.0.0.1;
            proxy_set_header Cookie $http_cookie;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============================================================
        # FASTAPI ADMIN BACKEND
        # ============================================================
        location /api/admin/ {
            proxy_pass http://127.0.0.1:7000/admin/;

            proxy_set_header Host 127.0.0.1;
            proxy_set_header Cookie $http_cookie;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ============================================================
        # INTERNAL AUTH CHECK ROUTES
        # ============================================================
        location = /auth_check {
            internal;
            proxy_pass http://127.0.0.1:7000/auth/verify;

            proxy_set_header Host 127.0.0.1;
            proxy_set_header Cookie $http_cookie;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization "";
        }

        location = /admin_check {
            internal;
            proxy_pass http://127.0.0.1:7000/admin/verify;

            proxy_set_header Host 127.0.0.1;
            proxy_set_header Cookie $http_cookie;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Authorization "";
        }

        # ============================================================
        # CHAINLIT ROUTES
        # ============================================================

        # Redirect bare /chat → /chat/
        location = /chat {
            return 302 /chat/;
        }

        # Chainlit health endpoint
        location = /chat/health {
            proxy_pass http://127.0.0.1:8000/chat/health;

            proxy_set_header Host 127.0.0.1;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 10;
        }

        # ============================================================
        # CRITICAL: WebSocket endpoint for Chainlit
        # ============================================================
        location /chat/ws {
            auth_request /auth_check;
            error_page 401 =302 /login;

            proxy_pass http://127.0.0.1:8000/chat/ws;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400;
        }

        # ============================================================
        # MAIN CHAINLIT APP (HTTP + WebSockets handled above)
        # ============================================================
        location /chat/ {
            auth_request /auth_check;
            error_page 401 =302 /login;

            access_log off;
            error_log /var/log/nginx/error.log warn;

            proxy_pass http://127.0.0.1:8000;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # ============================================================
        # ADMIN PANEL FRONTEND
        # ============================================================
        location /admin {
            auth_request /admin_check;
            error_page 401 =302 /login;
            error_page 403 =302 /login;

            proxy_pass http://127.0.0.1:3000;

            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
