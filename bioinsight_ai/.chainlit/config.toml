[project]
# Whether to enable telemetry (default: true). No personal data is collected.
enable_telemetry = true

# List of environment variables to be provided by each user to use the app.
user_env = []

# Duration (in seconds) during which the session is saved when the connection is lost
session_timeout = 86400 # 3600

# Duration (in seconds) of the user session expiry
user_session_timeout = 1296000  # 15 days

# Enable third parties caching (e.g., LangChain cache)
cache = false

# ✅ Required for sidebar/history
data_persistence = true

# Authorized origins
allow_origins = ["*"]

[features]
# ✅ Required for sidebar/history
enable_history = true

# Process and display HTML in messages
unsafe_allow_html = true

# Process and display mathematical expressions
latex = false

# Autoscroll new user messages at the top of the window
user_message_autoscroll = true

# Automatically tag threads with the current chat profile
auto_tag_thread = true

# Allow users to edit their own messages
edit_message = true

[features.auth]
# Disable Chainlit's built-in login page
disable = true

[features.spontaneous_file_upload]
enabled = true
accept = ["*/*"]
max_files = 20
max_size_mb = 500

[features.audio]
sample_rate = 24000

[features.slack]
reaction_on_message_received = false

[features.mcp.sse]
enabled = false

[features.mcp.streamable-http]
enabled = false

[features.mcp.stdio]
enabled = false

# Global MCP toggle - explicitly disable all MCP functionality unless enabled
[features.mcp]
enabled = false
allowed_executables = ["npx", "uvx"]

[UI]
# Assistant name in the UI
name = "BioInsight"

default_theme = "light"

# Sidebar should start open
default_sidebar_state = "open"

# Chain of Thought (CoT) display mode
cot = "full"

# Custom styling
custom_css = "/public/stylesheet.css"

# Custom JS header injection
custom_js = "/public/chat-header.js"

# Alert style
alert_style = "classic"

[meta]
generated_by = "2.6.9"
