version: 0.0
os: linux

files:
  - source: .env.runtime
    destination: /home/ubuntu/BDF-Chatbot

hooks:
  BeforeInstall:
    - location: scripts/cleanup_target.sh
      timeout: 60
      runas: ubuntu

  ApplicationStop:
    - location: scripts/stop_server.sh
      timeout: 30
      runas: ubuntu

  AfterInstall:
    - location: scripts/generate_salutation.sh
      timeout: 300
      runas: ubuntu

  ApplicationStart:
    - location: scripts/start_server.sh
      timeout: 900
      runas: ubuntu

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 600
      runas: ubuntu

